[package]
name = "chorus-server"
edition.workspace = true
license.workspace = true
version.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
chorus-core = { path = "../chorus-core" }
serde.workspace = true
serde_json.workspace = true
anyhow.workspace = true
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "sync", "time", "signal"] }
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
axum = "0.8"
tower-http = { version = "0.7", features = ["trace"] }
figment = { version = "0.10", features = ["toml", "env"] }
metrics = "0.24"
metrics-exporter-prometheus = { version = "0.18", default-features = false }
async-stream = "0.3"
futures.workspace = true

[dev-dependencies]
wiremock = "0.6"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
